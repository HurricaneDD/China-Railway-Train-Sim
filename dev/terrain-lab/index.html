<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>铁路地形实验 · 5 km 南京南走廊</title></head><body><main id="viewer"></main><aside><h1>铁路地形与车辆实验</h1><p>真实 OSM 平面线路 · 推定高程实验 · 非生产驾驶</p><label>数据 <select id="source"><option value="synthetic">可重复的人工鼓包</option><option value="world">在线 Cesium World Terrain</option></select></label><label>对比 <select id="mode"><option value="raw">A 原始高程</option><option value="smooth">B 仅修正轨面（观察地形穿轨）</option><option value="replace">C 修正轨面 + 裁剪并替换局部地面</option></select></label><label>里程 <input id="mileage" type="range" min="100" max="4900" value="1250" step="10"><output id="mileage-value">1250 m</output></label><div><button id="overview">外部视角</button><button id="cab">驾驶员眼点</button><button id="tour">往返巡检</button><button id="stress">切换/资源测试</button><button id="export">导出证据 JSON</button></div><p id="status">准备实验…</p><p id="summary"></p><canvas id="profile" width="600" height="150"></canvas><details><summary>原始测量与资源计数</summary><pre id="stats"></pre></details><p class="legend">灰：原始地表　绿：推定轨面　橙：裁剪边界<br>绿色机车为程序化示意；35‰ 只是本次实验约束。</p></aside><script type="module" src="./main.ts"></script></body></html>
